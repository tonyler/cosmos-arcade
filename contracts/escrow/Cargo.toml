[package]
name = "cosmos-arcade-escrow"
version = "0.1.0"
authors = ["CosmosArcade"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[dependencies]
cosmwasm-std = { version = "1.5", features = ["staking"] }
cosmwasm-schema = "1.5"
cw-storage-plus = "1.2"
schemars = "0.8"
serde = { version = "1", default-features = false, features = ["derive"] }
thiserror = "1"

[dev-dependencies]
cw-multi-test = "0.20"

# Pin base64ct to avoid edition2024 requirement — needed for old-toolchain builds
[patch.crates-io]
base64ct = { version = "=1.6.0" }

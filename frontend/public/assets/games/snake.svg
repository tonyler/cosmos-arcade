<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#0a1628"/>

  <!-- Grid lines -->
  <g stroke="#0d1f38" stroke-width="0.5">
    <line x1="40" y1="0" x2="40" y2="200"/><line x1="80" y1="0" x2="80" y2="200"/>
    <line x1="120" y1="0" x2="120" y2="200"/><line x1="160" y1="0" x2="160" y2="200"/>
    <line x1="0" y1="40" x2="200" y2="40"/><line x1="0" y1="80" x2="200" y2="80"/>
    <line x1="0" y1="120" x2="200" y2="120"/><line x1="0" y1="160" x2="200" y2="160"/>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="198" height="198" fill="none" stroke="#1e3050" stroke-width="2"/>

  <!-- Green snake body (P1) -->
  <rect x="42" y="82" width="36" height="36" rx="4" fill="#5bc235"/>
  <rect x="78" y="82" width="4" height="36" fill="#5bc235"/>
  <rect x="82" y="82" width="36" height="36" rx="4" fill="#5bc235"/>
  <rect x="118" y="82" width="4" height="36" fill="#5bc235"/>
  <!-- Head -->
  <rect x="122" y="82" width="36" height="36" rx="4" fill="#5bc235"/>
  <!-- Eyes -->
  <circle cx="146" cy="94" r="3" fill="white"/><circle cx="146" cy="106" r="3" fill="white"/>
  <circle cx="147.5" cy="94" r="1.2" fill="#111"/><circle cx="147.5" cy="106" r="1.2" fill="#111"/>

  <!-- Purple snake (P2) — going left, lower row -->
  <rect x="122" y="122" width="36" height="36" rx="4" fill="#9b35e8"/>
  <rect x="118" y="122" width="4" height="36" fill="#9b35e8"/>
  <rect x="82" y="122" width="36" height="36" rx="4" fill="#9b35e8"/>
  <rect x="78" y="122" width="4" height="36" fill="#9b35e8"/>
  <!-- Head -->
  <rect x="42" y="122" width="36" height="36" rx="4" fill="#9b35e8"/>
  <!-- Eyes -->
  <circle cx="54" cy="134" r="3" fill="white"/><circle cx="54" cy="146" r="3" fill="white"/>
  <circle cx="52.5" cy="134" r="1.2" fill="#111"/><circle cx="52.5" cy="146" r="1.2" fill="#111"/>

  <!-- Atom food (center) -->
  <circle cx="100" cy="50" r="14" fill="rgba(0,212,255,0.15)"/>
  <circle cx="100" cy="50" r="4" fill="#00d4ff"/>
  <ellipse cx="100" cy="50" rx="13" ry="5" fill="none" stroke="rgba(0,212,255,0.6)" stroke-width="1" transform="rotate(0 100 50)"/>
  <ellipse cx="100" cy="50" rx="13" ry="5" fill="none" stroke="rgba(0,212,255,0.6)" stroke-width="1" transform="rotate(60 100 50)"/>
  <ellipse cx="100" cy="50" rx="13" ry="5" fill="none" stroke="rgba(0,212,255,0.6)" stroke-width="1" transform="rotate(120 100 50)"/>
</svg>

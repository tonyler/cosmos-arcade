<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" shape-rendering="crispEdges">
  <!-- Sky gradient -->
  <rect width="320" height="100" fill="#1a0a0a"/>
  <rect y="40"  width="320" height="30" fill="#2a1010"/>
  <rect y="70"  width="320" height="30" fill="#3a1818"/>

  <!-- Floor -->
  <rect y="100" width="320" height="100" fill="#1c1208"/>
  <rect y="100" width="320" height="4"   fill="#2a1a0a"/>

  <!-- Raycasted wall corridor — center -->
  <rect x="110" y="20" width="100" height="80" fill="#8B2020"/>
  <rect x="115" y="22" width="90"  height="76" fill="#6B1818"/>
  <!-- Wall shading lines -->
  <rect x="115" y="22" width="2" height="76" fill="#4a1010"/>
  <rect x="203" y="22" width="2" height="76" fill="#4a1010"/>
  <rect x="120" y="22" width="75" height="2" fill="#9B2828"/>

  <!-- Side walls (perspective) -->
  <rect x="60"  y="35" width="50" height="65" fill="#6B1818"/>
  <rect x="210" y="35" width="50" height="65" fill="#5B1414"/>
  <rect x="10"  y="45" width="50" height="55" fill="#4B1010"/>
  <rect x="260" y="45" width="50" height="55" fill="#3B0c0c"/>

  <!-- Door frame in center -->
  <rect x="140" y="30" width="40" height="70" fill="#0a0505"/>
  <rect x="142" y="32" width="36" height="66" fill="#100808"/>
  <!-- Door highlights -->
  <rect x="142" y="32" width="2"  height="66" fill="#1e0e0e"/>
  <rect x="176" y="32" width="2"  height="66" fill="#1e0e0e"/>

  <!-- Weapon (shotgun) at bottom center -->
  <rect x="140" y="155" width="40" height="8"  fill="#8B7355"/>
  <rect x="145" y="148" width="30" height="10" fill="#6B5535"/>
  <rect x="152" y="143" width="16" height="8"  fill="#4a3a22"/>
  <!-- Barrel -->
  <rect x="154" y="130" width="6"  height="16" fill="#3a2e1a"/>
  <rect x="155" y="128" width="4"  height="4"  fill="#2a2010"/>
  <!-- Stock -->
  <rect x="142" y="158" width="36" height="6"  fill="#7B6345"/>

  <!-- Crosshair -->
  <rect x="158" y="96"  width="4" height="2" fill="#ff4444"/>
  <rect x="158" y="102" width="4" height="2" fill="#ff4444"/>
  <rect x="153" y="99"  width="4" height="2" fill="#ff4444"/>
  <rect x="163" y="99"  width="4" height="2" fill="#ff4444"/>

  <!-- HUD bar at bottom -->
  <rect y="185" width="320" height="15" fill="#0a0505"/>
  <!-- Health -->
  <rect x="4"   y="188" width="50" height="9" fill="#2a0a0a"/>
  <rect x="4"   y="188" width="35" height="9" fill="#cc2222"/>
  <rect x="5"   y="189" width="33" height="3" fill="#ff4444"/>
  <!-- Ammo -->
  <rect x="266" y="188" width="50" height="9" fill="#0a0a2a"/>
  <rect x="266" y="188" width="38" height="9" fill="#2244cc"/>
  <rect x="267" y="189" width="36" height="3" fill="#4466ff"/>

  <!-- Score dots -->
  <rect x="120" y="188" width="6" height="9" fill="#cc2222"/>
  <rect x="128" y="188" width="6" height="9" fill="#cc2222"/>
  <rect x="136" y="188" width="6" height="9" fill="#cc2222"/>
  <rect x="144" y="188" width="6" height="9" fill="#cc2222"/>
  <rect x="152" y="188" width="6" height="9" fill="#cc2222"/>
  <rect x="160" y="188" width="6" height="9" fill="#2244cc"/>
  <rect x="168" y="188" width="6" height="9" fill="#2244cc"/>
  <rect x="176" y="188" width="6" height="9" fill="#2244cc"/>

  <!-- Title overlay -->
  <rect x="0" y="0" width="320" height="18" fill="rgba(0,0,0,0.7)"/>
  <text x="160" y="13" font-family="monospace" font-size="11" fill="#f5edba" text-anchor="middle" letter-spacing="2">RETRO FPS</text>
</svg>

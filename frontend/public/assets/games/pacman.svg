<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <!-- Background -->
  <rect width="320" height="180" fill="#000"/>

  <!-- Maze walls -->
  <g fill="none" stroke="#1e3a8a" stroke-width="4" stroke-linejoin="round">
    <!-- Outer border -->
    <rect x="6" y="6" width="308" height="168" rx="2"/>
    <!-- Top-left block -->
    <rect x="20" y="20" width="60" height="36"/>
    <!-- Top-right block -->
    <rect x="240" y="20" width="60" height="36"/>
    <!-- Bottom-left block -->
    <rect x="20" y="124" width="60" height="36"/>
    <!-- Bottom-right block -->
    <rect x="240" y="124" width="60" height="36"/>
    <!-- Center box -->
    <rect x="120" y="66" width="80" height="48" rx="2"/>
  </g>

  <!-- Pellets -->
  <g fill="#ffff88">
    <circle cx="100" cy="40" r="3"/>
    <circle cx="120" cy="40" r="3"/>
    <circle cx="140" cy="40" r="3"/>
    <circle cx="160" cy="40" r="3"/>
    <circle cx="180" cy="40" r="3"/>
    <circle cx="200" cy="40" r="3"/>
    <circle cx="100" cy="90" r="3"/>
    <circle cx="220" cy="90" r="3"/>
    <circle cx="100" cy="140" r="3"/>
    <circle cx="120" cy="140" r="3"/>
    <circle cx="200" cy="140" r="3"/>
    <circle cx="220" cy="140" r="3"/>
  </g>

  <!-- Power pellets -->
  <circle cx="30" cy="58" r="6" fill="#ffff00"/>
  <circle cx="290" cy="58" r="6" fill="#ffff00"/>
  <circle cx="30" cy="122" r="6" fill="#ffff00"/>
  <circle cx="290" cy="122" r="6" fill="#ffff00"/>

  <!-- Ghost: Blinky (red) -->
  <g transform="translate(215,85)">
    <path d="M-14,10 Q-14,-14 0,-14 Q14,-14 14,10 L14,16 L10,12 L6,16 L2,12 L-2,16 L-6,12 L-10,16 Z" fill="#ff0000"/>
    <ellipse cx="-5" cy="-2" rx="4" ry="4" fill="white"/>
    <ellipse cx="5" cy="-2" rx="4" ry="4" fill="white"/>
    <circle cx="-4" cy="-1" r="2" fill="#222299"/>
    <circle cx="6" cy="-1" r="2" fill="#222299"/>
  </g>

  <!-- Ghost: Pinky (pink) -->
  <g transform="translate(240,85)">
    <path d="M-14,10 Q-14,-14 0,-14 Q14,-14 14,10 L14,16 L10,12 L6,16 L2,12 L-2,16 L-6,12 L-10,16 Z" fill="#ff99cc"/>
    <ellipse cx="-5" cy="-2" rx="4" ry="4" fill="white"/>
    <ellipse cx="5" cy="-2" rx="4" ry="4" fill="white"/>
    <circle cx="-4" cy="-1" r="2" fill="#222299"/>
    <circle cx="6" cy="-1" r="2" fill="#222299"/>
  </g>

  <!-- Pac-Man (facing right, eating) -->
  <g transform="translate(155,90)">
    <path d="M0,0 L24,-14 A26,26 0 1,0 24,14 Z" fill="#facc15"/>
  </g>

  <!-- Score -->
  <text x="160" y="16" text-anchor="middle" font-family="monospace" font-size="10" fill="#facc15" letter-spacing="1">SCORE  2600</text>

  <!-- READY! text -->
  <text x="160" y="112" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffaaff" letter-spacing="2">READY!</text>
</svg>

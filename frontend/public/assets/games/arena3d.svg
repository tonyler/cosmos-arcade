<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <!-- Background -->
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0d1a3a"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>

    <!-- Cyan glow -->
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Orange glow -->
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>

    <!-- Bullet trail -->
    <linearGradient id="bullet1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="bullet2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="1"/>
    </linearGradient>

    <!-- Floor gradient -->
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <!-- Scanlines -->
    <pattern id="scan" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="3" fill="transparent"/>
      <rect y="3" width="1" height="1" fill="black" fill-opacity="0.08"/>
    </pattern>

    <!-- Grid -->
    <pattern id="grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0d2044" stroke-width="0.5"/>
    </pattern>

    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur-md">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur-lg">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="400" height="225" fill="url(#bg)"/>

  <!-- Grid floor (isometric-ish feel) -->
  <rect width="400" height="225" fill="url(#grid)" opacity="0.7"/>

  <!-- Arena border glow -->
  <rect x="22" y="18" width="356" height="189" fill="none" stroke="#1e4080" stroke-width="1.5" rx="1"/>
  <rect x="22" y="18" width="356" height="189" fill="none" stroke="#00aaff" stroke-width="0.5" rx="1" opacity="0.4"/>

  <!-- ── Obstacles (isometric boxes, top-down look) ─────────────────────────── -->

  <!-- Center block -->
  <rect x="172" y="96" width="56" height="33" fill="#0a1628" stroke="#1e4080" stroke-width="1"/>
  <rect x="172" y="96" width="56" height="33" fill="none" stroke="#00aaff" stroke-width="0.4" opacity="0.5"/>
  <!-- top face highlight -->
  <rect x="172" y="96" width="56" height="3" fill="#112244" opacity="0.9"/>

  <!-- Top covers -->
  <rect x="100" y="44" width="52" height="10" fill="#0a1628" stroke="#1e4080" stroke-width="1"/>
  <rect x="100" y="44" width="52" height="10" fill="none" stroke="#00aaff" stroke-width="0.4" opacity="0.4"/>
  <rect x="248" y="44" width="52" height="10" fill="#0a1628" stroke="#1e4080" stroke-width="1"/>
  <rect x="248" y="44" width="52" height="10" fill="none" stroke="#00aaff" stroke-width="0.4" opacity="0.4"/>

  <!-- Bottom covers -->
  <rect x="100" y="171" width="52" height="10" fill="#0a1628" stroke="#1e4080" stroke-width="1"/>
  <rect x="100" y="171" width="52" height="10" fill="none" stroke="#00aaff" stroke-width="0.4" opacity="0.4"/>
  <rect x="248" y="171" width="52" height="10" fill="#0a1628" stroke="#1e4080" stroke-width="1"/>
  <rect x="248" y="171" width="52" height="10" fill="none" stroke="#00aaff" stroke-width="0.4" opacity="0.4"/>

  <!-- Side pillars -->
  <rect x="52" y="84" width="10" height="57" fill="#0a1628" stroke="#1e4080" stroke-width="1"/>
  <rect x="52" y="84" width="10" height="57" fill="none" stroke="#00aaff" stroke-width="0.4" opacity="0.4"/>
  <rect x="338" y="84" width="10" height="57" fill="#0a1628" stroke="#1e4080" stroke-width="1"/>
  <rect x="338" y="84" width="10" height="57" fill="none" stroke="#00aaff" stroke-width="0.4" opacity="0.4"/>

  <!-- ── Player 1 (cyan) ─────────────────────────────────────────────────────── -->

  <!-- P1 aura -->
  <ellipse cx="78" cy="112" rx="38" ry="32" fill="url(#glow1)" filter="url(#blur-md)"/>

  <!-- P1 body (circle = cylinder top-down) -->
  <circle cx="78" cy="112" r="12" fill="#0d1f3a" stroke="#00d4ff" stroke-width="1.5"/>
  <circle cx="78" cy="112" r="12" fill="#00d4ff" fill-opacity="0.12"/>

  <!-- P1 orb / core -->
  <circle cx="78" cy="112" r="4.5" fill="#00d4ff" opacity="0.9"/>
  <circle cx="78" cy="112" r="4.5" fill="#00d4ff" filter="url(#blur-sm)" opacity="0.8"/>

  <!-- P1 gun barrel (pointing right) -->
  <rect x="90" y="110" width="14" height="4" rx="1" fill="#00d4ff" opacity="0.85"/>
  <rect x="90" y="110" width="14" height="4" rx="1" fill="#00d4ff" filter="url(#blur-sm)" opacity="0.5"/>

  <!-- ── Player 2 (orange) ───────────────────────────────────────────────────── -->

  <!-- P2 aura -->
  <ellipse cx="322" cy="112" rx="38" ry="32" fill="url(#glow2)" filter="url(#blur-md)"/>

  <!-- P2 body -->
  <circle cx="322" cy="112" r="12" fill="#2a0d08" stroke="#ff6b35" stroke-width="1.5"/>
  <circle cx="322" cy="112" r="12" fill="#ff6b35" fill-opacity="0.12"/>

  <!-- P2 orb -->
  <circle cx="322" cy="112" r="4.5" fill="#ff6b35" opacity="0.9"/>
  <circle cx="322" cy="112" r="4.5" fill="#ff6b35" filter="url(#blur-sm)" opacity="0.8"/>

  <!-- P2 gun barrel (pointing left) -->
  <rect x="296" y="110" width="14" height="4" rx="1" fill="#ff6b35" opacity="0.85"/>
  <rect x="296" y="110" width="14" height="4" rx="1" fill="#ff6b35" filter="url(#blur-sm)" opacity="0.5"/>

  <!-- ── Bullets in flight ───────────────────────────────────────────────────── -->

  <!-- P1 bullet trail -->
  <line x1="104" y1="112" x2="162" y2="112" stroke="url(#bullet1)" stroke-width="1.5"/>
  <!-- P1 bullet head -->
  <circle cx="164" cy="112" r="3" fill="#00d4ff"/>
  <circle cx="164" cy="112" r="3" fill="#00d4ff" filter="url(#blur-sm)" opacity="0.9"/>

  <!-- P2 bullet trail -->
  <line x1="296" y1="112" x2="238" y2="112" stroke="url(#bullet2)" stroke-width="1.5"/>
  <!-- P2 bullet head -->
  <circle cx="236" cy="112" r="3" fill="#ff6b35"/>
  <circle cx="236" cy="112" r="3" fill="#ff6b35" filter="url(#blur-sm)" opacity="0.9"/>

  <!-- ── Extra ambient bullets (off-axis) ───────────────────────────────────── -->
  <!-- P1 bullet going diagonally up -->
  <line x1="102" y1="108" x2="145" y2="74" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
  <circle cx="147" cy="73" r="2.2" fill="#00d4ff" opacity="0.7"/>

  <!-- P2 bullet going diagonally down -->
  <line x1="298" y1="116" x2="255" y2="150" stroke="#ff6b35" stroke-width="1" opacity="0.4"/>
  <circle cx="253" cy="152" r="2.2" fill="#ff6b35" opacity="0.7"/>

  <!-- ── Kill score HUD ─────────────────────────────────────────────────────── -->

  <!-- P1 score area -->
  <text x="36" y="32" font-family="monospace" font-size="9" fill="#00d4ff" opacity="0.9" letter-spacing="1">P1</text>
  <rect x="34" y="36" width="8" height="5" rx="1" fill="#00d4ff" opacity="0.85"/>
  <rect x="44" y="36" width="8" height="5" rx="1" fill="#00d4ff" opacity="0.85"/>
  <rect x="54" y="36" width="8" height="5" rx="1" fill="#00d4ff" opacity="0.85"/>
  <rect x="64" y="36" width="8" height="5" rx="1" fill="#1e293b"/>
  <rect x="74" y="36" width="8" height="5" rx="1" fill="#1e293b"/>

  <!-- P2 score area -->
  <text x="352" y="32" font-family="monospace" font-size="9" fill="#ff6b35" opacity="0.9" letter-spacing="1">P2</text>
  <rect x="298" y="36" width="8" height="5" rx="1" fill="#1e293b"/>
  <rect x="308" y="36" width="8" height="5" rx="1" fill="#1e293b"/>
  <rect x="318" y="36" width="8" height="5" rx="1" fill="#ff6b35" opacity="0.85"/>
  <rect x="328" y="36" width="8" height="5" rx="1" fill="#ff6b35" opacity="0.85"/>
  <rect x="338" y="36" width="8" height="5" rx="1" fill="#ff6b35" opacity="0.85"/>

  <!-- Title -->
  <text x="200" y="30" font-family="monospace" font-size="11" fill="white" opacity="0.18" text-anchor="middle" letter-spacing="4" font-weight="bold">FIRST TO 5</text>

  <!-- ── Scanlines overlay ───────────────────────────────────────────────────── -->
  <rect width="400" height="225" fill="url(#scan)"/>

  <!-- ── Vignette ───────────────────────────────────────────────────────────── -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="400" height="225" fill="url(#vignette)"/>

  <!-- Corner brackets -->
  <path d="M 22 35 L 22 18 L 39 18" fill="none" stroke="#4c1d95" stroke-width="1.5" opacity="0.6"/>
  <path d="M 378 35 L 378 18 L 361 18" fill="none" stroke="#4c1d95" stroke-width="1.5" opacity="0.6"/>
  <path d="M 22 190 L 22 207 L 39 207" fill="none" stroke="#4c1d95" stroke-width="1.5" opacity="0.6"/>
  <path d="M 378 190 L 378 207 L 361 207" fill="none" stroke="#4c1d95" stroke-width="1.5" opacity="0.6"/>
</svg>
